<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Liviz Software{% endblock %}</title>
  <meta name="description" content="Liviz Software — sistemas sob medida, automações e tecnologia que simplifica negócios.">
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    try {
      const nav = performance.getEntriesByType('navigation')[0];
      const internal = document.referrer && new URL(document.referrer).origin === location.origin;
      if ((nav && nav.type === 'reload') || !internal) document.documentElement.classList.add('intro-on');
    } catch (e) {
      document.documentElement.classList.add('intro-on');
    }
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="intro" aria-hidden="true">
    <div class="intro-glow"></div>
    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="">
  </div>

  <header>
    <a class="brand" href="{{ url_for('home') }}" aria-label="Liviz Software - início">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Liviz Software">
      <span><b>LIVIZ</b><small>SOFTWARE</small></span>
    </a>
    <nav>
      <a href="{{ url_for('home') }}">Início</a>
      <a href="{{ url_for('home') }}#solucoes">Soluções</a>
      <a href="{{ url_for('projetos') }}">Projetos</a>
      <a href="{{ url_for('home') }}#sobre">Sobre</a>
      <a class="cta-link" href="{{ whatsapp_url }}" target="_blank" rel="noopener">Solicitar orçamento</a>
    </nav>
  </header>

  <main>{% block content %}{% endblock %}</main>

  <a class="whatsapp-float" href="{{ whatsapp_url }}" target="_blank" rel="noopener" aria-label="Falar com a Liviz Software pelo WhatsApp" title="Falar pelo WhatsApp">
    <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path fill="currentColor" d="M19.11 17.47c-.27-.14-1.59-.78-1.84-.87-.25-.09-.43-.14-.61.14-.18.27-.7.87-.86 1.05-.16.18-.32.2-.59.07-.27-.14-1.15-.42-2.19-1.35-.81-.72-1.36-1.61-1.52-1.88-.16-.27-.02-.42.12-.55.12-.12.27-.32.41-.48.14-.16.18-.27.27-.46.09-.18.05-.34-.02-.48-.07-.14-.61-1.47-.84-2.01-.22-.53-.45-.46-.61-.47h-.52c-.18 0-.48.07-.73.34-.25.27-.95.93-.95 2.26 0 1.33.98 2.62 1.11 2.8.14.18 1.92 2.93 4.65 4.11.65.28 1.16.45 1.55.57.65.21 1.24.18 1.71.11.52-.08 1.59-.65 1.82-1.28.23-.63.23-1.17.16-1.28-.07-.11-.25-.18-.52-.32ZM16.04 3C8.86 3 3.02 8.82 3.02 15.98c0 2.29.6 4.52 1.74 6.49L3 29l6.7-1.75a13 13 0 0 0 6.33 1.61h.01c7.18 0 13.02-5.82 13.02-12.98C29.06 8.82 23.22 3 16.04 3Zm0 23.67h-.01a10.8 10.8 0 0 1-5.5-1.5l-.39-.23-3.98 1.04 1.06-3.87-.25-.4a10.72 10.72 0 0 1-1.66-5.73c0-5.95 4.82-10.79 10.74-10.79 5.93 0 10.75 4.84 10.75 10.79 0 5.95-4.82 10.79-10.76 10.79Z"/></svg>
  </a>

  <footer>
    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Liviz Software">
    <strong>LIVIZ SOFTWARE</strong>
    <p>Tecnologia que simplifica negócios.</p>
    <div class="footer-contact">
      <a href="mailto:{{ contact_email }}">{{ contact_email }}</a>
      <span>•</span>
      <a href="{{ whatsapp_url }}" target="_blank" rel="noopener">{{ whatsapp_number_display }}</a>
    </div>
    <small>© 2026 Liviz Software. Todos os direitos reservados.</small>
  </footer>
</body>
</html>
